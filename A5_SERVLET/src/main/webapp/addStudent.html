<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Registration</title>
<link rel="stylesheet" href="css/index.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

	<div class="container">
		<h1>Student Registration Form</h1>

		<form class="form-card" action="addstudent">

			<div class="form-group">
				<label for="name">Full Name</label> <input type="text" id="name"
					name="name" placeholder="Enter full name" required>
			</div>

			<div class="form-group">
				<label for="age">Age</label> <input type="number" id="age"
					name="age" placeholder="Enter age" required>
			</div>

			<div class="form-group">
				<label for="phone">Phone Number</label> <input type="tel" id="phone"
					name="phone" placeholder="Enter phone number" required>
			</div>

			<div class="form-group">
				<label for="email">Email Address</label> <input type="email"
					id="email" name="email" placeholder="Enter email address" required>
			</div>

			<button type="submit" class="btn primary-btn">Register
				Student</button>

		</form>
	</div>

</body>
</html>
